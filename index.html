<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Lukintosh Download</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
display:flex;
font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(120deg,#0f172a,#1e293b,#020617);
color:white;
overflow:hidden;
}

.container{display:flex;width:100%;height:100%;}

.left{
flex:1;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.slide{
position:absolute;
width:90%;
height:80%;
object-fit:cover;
border-radius:24px;
opacity:0;
transition:opacity 1.5s;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.right{
width:420px;
display:flex;
justify-content:center;
align-items:center;
}

.panel{
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
padding:40px;
border-radius:24px;
width:340px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.file{
display:flex;
justify-content:space-between;
margin-top:10px;
}

button{
background:rgba(255,255,255,0.15);
border:1px solid rgba(255,255,255,0.3);
color:white;
padding:8px 16px;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:rgba(255,255,255,0.3);
}

input{
width:100%;
padding:8px;
border-radius:8px;
border:none;
margin-bottom:5px;
}

.progress{
height:10px;
background:rgba(255,255,255,0.1);
border-radius:10px;
margin-top:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#60a5fa,#a78bfa);
}

.stats{
margin-top:12px;
font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<div class="left">
<img class="slide" src="https://picsum.photos/1200/800?1">
<img class="slide" src="https://picsum.photos/1200/800?2">
<img class="slide" src="https://picsum.photos/1200/800?3">
<img class="slide" src="https://picsum.photos/1200/800?4">
</div>

<div class="right">
<div class="panel">

<h2>Lukintosh Products</h2>

<!-- 🔐 LOGIN -->
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Senha">

<button onclick="register()">Criar conta</button>
<button onclick="login()">Login</button>

<hr>

<!-- 📦 PRODUTOS -->
<div class="file">
<span>Lukintosh Editor Pro</span>
<button onclick="requestTrial('editor-pro')">Request Trial</button>
</div>

<div class="file">
<span>Lukintosh Engine</span>
<button onclick="requestTrial('engine')">Request Trial</button>
</div>

<div class="file">
<span>Lukintosh Cloud</span>
<button onclick="requestTrial('cloud')">Request Trial</button>
</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="stats" id="stats"></div>

</div>
</div>

</div>

<script>

// 🔐 TOKEN
let token = localStorage.getItem("token")

// ================= REGISTER =================
async function register(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const res = await fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email,password})
})

const data = await res.json()

document.getElementById("stats").innerText =
data.error || "Conta criada 🚀"
}

// ================= LOGIN =================
async function login(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const res = await fetch("/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({email,password})
})

const text = await res.text()

let data
try{
data = JSON.parse(text)
}catch{
document.getElementById("stats").innerText = text
return
}

if(!res.ok){
document.getElementById("stats").innerText = data.error
return
}

token = data.token
localStorage.setItem("token", token)

document.getElementById("stats").innerText="Logado 🚀"
}

// ================= REQUEST TRIAL =================
async function requestTrial(product){

token = localStorage.getItem("token")

if(!token){
document.getElementById("stats").innerText="Faça login primeiro"
return
}

document.getElementById("stats").innerText="Enviando email..."

const res = await fetch("/request-trial",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+token
},
body:JSON.stringify({product})
})

const data = await res.json()

document.getElementById("stats").innerText =
data.message || data.error
}

// ================= SLIDES =================
const slides=document.querySelectorAll(".slide")
let i=0

setInterval(()=>{
slides.forEach(s=>s.style.opacity=0)
slides[i].style.opacity=1
i++
if(i>=slides.length) i=0
},4000)

</script>

</body>
</html>
